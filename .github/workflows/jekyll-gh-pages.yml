<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>Love Reel</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: black;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }

  /* Phone frame */
  .reel {
    width: 360px;
    height: 640px;
    background: radial-gradient(circle at top, #2b004f, #000);
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(255,0,150,0.6);
  }

  /* Heart */
  .heart {
    position: absolute;
    top: 45%;
    left: 50%;
    width: 100px;
    height: 90px;
    background: linear-gradient(45deg, #ff2d75, #ff9ad5);
    transform: translate(-50%, -50%) rotate(-45deg);
    animation: beat 1s infinite;
    box-shadow: 0 0 40px rgba(255,100,200,0.9);
  }

  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 100px;
    height: 90px;
    background: inherit;
    border-radius: 50%;
  }

  .heart::before {
    top: -50px;
    left: 0;
  }

  .heart::after {
    left: 50px;
    top: 0;
  }

  @keyframes beat {
    0%,100% {
      transform: translate(-50%, -50%) rotate(-45deg) scale(1);
    }
    50% {
      transform: translate(-50%, -50%) rotate(-45deg) scale(1.25);
    }
  }

  /* Name & message */
  .name {
    position: absolute;
    top: 60px;
    width: 100%;
    text-align: center;
    font-size: 28px;
    color: #ffb3ec;
    letter-spacing: 2px;
  }

  .msg {
    position: absolute;
    top: 100px;
    width: 100%;
    text-align: center;
    font-size: 16px;
    color: #ffd9f3;
    opacity: 0.9;
  }

  /* Falling hearts */
  .rain {
    position: absolute;
    top: -20px;
    color: pink;
    font-size: 20px;
    animation: fall linear forwards;
    opacity: 0.8;
  }

  @keyframes fall {
    to {
      transform: translateY(700px);
      opacity: 0;
    }
  }

  /* Music hint */
  .hint {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: #aaa;
  }
</style>
</head>
<body>

<div class="reel">
  <div class="name">💌 MY FUTURE LOVE</div>
  <div class="msg">I love you more every beat ❤️</div>
  <div class="heart" id="heart"></div>
  <div class="hint">🔊 Tap anywhere for music</div>
</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/10/30/audio_8b0b5c5c8f.mp3" type="audio/mpeg">
</audio>

<script>
  const reel = document.querySelector(".reel");
  const music = document.getElementById("music");
  const heart = document.getElementById("heart");

  // Start music on tap
  reel.addEventListener("click", () => {
    music.play();
  });

  // Music sync (simple beat)
  music.addEventListener("timeupdate", () => {
    heart.style.animationDuration = "0.9s";
  });

  // Heart rain
  setInterval(() => {
    const h = document.createElement("div");
    h.className = "rain";
    h.innerHTML = "💖";
    h.style.left = Math.random() * 360 + "px";
    h.style.animationDuration = (2 + Math.random() * 3) + "s";
    reel.appendChild(h);

    setTimeout(() => h.remove(), 5000);
  }, 300);
</script>

</body>
</html>
